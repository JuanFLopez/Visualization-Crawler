<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Hovers de CSS</title>
  <style>
    /* REAL: a bar's highlight. With a transition: CSS ones do not follow the page clock */
    .bar { fill: steelblue; transition: fill 300ms; }
    .bar:hover { fill: orange; }

    /* REAL: the hover belongs to the group; what changes is the circle inside */
    .node circle { fill: gray; stroke: none; }
    .node:hover circle { stroke: black; stroke-width: 3px; }

    /* FALSE: only the cursor changes, nothing looks different */
    .plain:hover { cursor: pointer; }

    /* FALSE: the rule exists, but the element's inline style (with !important) wins over it */
    .locked:hover { fill: orange; }

    /* FALSE: the element is not visible */
    .ghost:hover { fill: orange; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <script src="d3.min.js"></script>
  <script>
    /*
      Hovers that are CSS only: there is not a single hover handler, and D3 builds everything else. The
      real ones (the bars, the "node" group) have to show up in the automaton; none of the false ones.
      Clicking "toggle" changes state: barA disappears and barD appears. See esperado.txt.
    */
    const svg = d3.create("svg")
        .attr("width", 520)
        .attr("height", 220)
        .style("font", "12px sans-serif");

    // the bars, one per datum
    const bar = svg.selectAll("rect.bar")
      .data([{ name: "barA", value: 80 }, { name: "barB", value: 50 }, { name: "barC", value: 65 }, { name: "barD", value: 40 }])
      .join("rect")
        .attr("class", "bar")
        .attr("x", (d, i) => 20 + i * 60)
        .attr("y", (d) => 110 - d.value)
        .attr("width", 40)
        .attr("height", (d) => d.value)
        .style("display", (d) => (d.name === "barD" ? "none" : null));
    bar.append("title").text((d) => d.name);

    // the group whose hover highlights the circle
    const node = svg.append("g").attr("class", "node");
    node.append("title").text("node");
    node.append("circle")
        .attr("cx", 330)
        .attr("cy", 70)
        .attr("r", 26);

    // FALSE: a rect with a :hover rule that only declares the cursor
    svg.append("rect").attr("class", "plain").attr("x", 20).attr("y", 140).attr("width", 40).attr("height", 30).attr("fill", "lightgray")
      .append("title").text("plain");

    // FALSE: a rect with a :hover rule that does not win
    svg.append("rect").attr("class", "locked").attr("x", 80).attr("y", 140).attr("width", 40).attr("height", 30)
        .style("fill", "steelblue", "important")
      .append("title").text("locked");

    // FALSE: a rect that is not visible
    svg.append("rect").attr("class", "ghost").attr("x", 140).attr("y", 140).attr("width", 40).attr("height", 30)
        .style("display", "none")
      .append("title").text("ghost");

    // the only thing that can be clicked: it changes state
    svg.append("circle")
        .attr("cx", 450)
        .attr("cy", 150)
        .attr("r", 20)
        .attr("fill", "dimgray")
      .on("click", () => {
        const second = bar.filter((d) => d.name === "barD").style("display") === "none";
        bar.filter((d) => d.name === "barA").style("display", second ? "none" : null);
        bar.filter((d) => d.name === "barD").style("display", second ? null : "none");
      })
      .append("title").text("toggle");

    document.querySelector("#chart").append(svg.node());
  </script>
</body>
</html>
