<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Un listener delegado en el svg</title>
</head>
<body>
  <div id="chart"></div>
  <script src="d3.min.js"></script>
  <script>
    /*
      A single hover listener, on the <svg>, that looks at event.target.__data__ (the delegated way of
      writing it with D3). Probed on the <svg> itself it does nothing: the target is the svg. The marks
      (markA..markD, with object data) highlight; the legend texts have string data and the handler
      ignores them: they are not actions. See esperado.txt.
    */
    const base = "steelblue";

    const svg = d3.create("svg")
        .attr("width", 420)
        .attr("height", 200)
        .style("font", "12px sans-serif");

    // the marks: one circle per datum
    const mark = svg.append("g").attr("class", "marks").selectAll("circle")
      .data([{ name: "markA", x: 50 }, { name: "markB", x: 120 }, { name: "markC", x: 190 }, { name: "markD", x: 260 }])
      .join("circle")
        .attr("cx", (d) => d.x)
        .attr("cy", 60)
        .attr("r", 26)
        .attr("fill", base);
    mark.append("title").text((d) => d.name);

    // the legend: texts with string data
    svg.append("g").attr("class", "legend").selectAll("text")
      .data(["Leyenda 1", "Leyenda 2"])
      .join("text")
        .attr("x", 20)
        .attr("y", (d, i) => 140 + i * 20)
        .text((d) => d);

    // the delegated listener: it looks at what the pointer was put over, and only acts if it is a mark
    const isMark = (target) => target.__data__ != null && typeof target.__data__ === "object";
    svg
        .on("mouseover", (event) => { if (isMark(event.target)) d3.select(event.target).attr("fill", "orange"); })
        .on("mouseout", (event) => { if (isMark(event.target)) d3.select(event.target).attr("fill", base); });

    document.querySelector("#chart").append(svg.node());
  </script>
</body>
</html>
