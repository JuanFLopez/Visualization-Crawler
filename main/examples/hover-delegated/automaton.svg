<tspan x="40" y="244">EQUIVALENT (cut automaton · complete interactions)</tspan>
</text>
<text x="40" y="277" font-weight="bold" fill="#222">Regex with the cycles cut (complete interactions; 0 shortcuts listed apart, see regex.cycles in transitions.json)</text>
