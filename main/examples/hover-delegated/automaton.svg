<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="346">Hover_markA, Hover_markB, Hover_markC, Hover_markD (4; loop on the state): fill: steelblue -&gt; orange</tspan>
