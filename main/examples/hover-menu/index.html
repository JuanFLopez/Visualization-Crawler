<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Menú que se abre con hover</title>
</head>
<body>
  <div id="chart"></div>
  <script src="d3.min.js"></script>
  <script>
    /*
      A dropdown menu built with D3: its options are only visible while the pointer is over the
      menu. Without exploring the hover there is nothing to click; with it, the user can pick A or B,
      and "reset" goes back to the start. See esperado.txt.
    */
    const width = 420;
    const height = 200;
    const rowHeight = 28;
    const options = [
      { name: "optionA", label: "Opción A", color: "#2a9d8f" },
      { name: "optionB", label: "Opción B", color: "#e76f51" },
    ];

    const svg = d3.create("svg")
        .attr("width", width)
        .attr("height", height)
        .style("font", "12px sans-serif");

    // the menu is a group: the hover applies to the button and the options together
    const menu = svg.append("g")
        .attr("class", "menu")
        .attr("transform", "translate(20,20)");
    menu.append("title").text("menu");
    menu.append("rect")
        .attr("width", 120)
        .attr("height", 30)
        .attr("fill", "#ddd")
        .attr("stroke", "#999");
    menu.append("text")
        .attr("x", 12)
        .attr("y", 20)
        .text("Menú");

    // the options, one per datum; they start hidden
    const items = menu.append("g")
        .attr("class", "items")
        .style("display", "none");
    const option = items.selectAll("g")
      .data(options)
      .join("g")
        .attr("class", "option")
        .attr("transform", (d, i) => `translate(0,${30 + i * rowHeight})`);
    option.append("title").text((d) => d.name);
    option.append("rect")
        .attr("width", 120)
        .attr("height", rowHeight)
        .attr("fill", "#eef");
    option.append("text")
        .attr("x", 12)
        .attr("y", 19)
        .text((d) => d.label);

    // what remains after choosing: a circle in the option's color, and "reset"
    const chosen = svg.append("circle")
        .attr("cx", 300)
        .attr("cy", 35)
        .attr("r", 14)
        .style("display", "none");
    const reset = svg.append("g")
        .attr("class", "reset")
        .attr("transform", "translate(260,70)")
        .style("display", "none");
    reset.append("title").text("reset");
    reset.append("rect")
        .attr("width", 80)
        .attr("height", 26)
        .attr("fill", "#fee")
        .attr("stroke", "#c99");
    reset.append("text")
        .attr("x", 18)
        .attr("y", 18)
        .text("Reset");

    // the menu opens on enter and closes on leave
    menu
        .on("mouseenter", () => items.style("display", null))
        .on("mouseleave", () => items.style("display", "none"));

    // choosing an option closes the menu and shows the result
    option.on("click", (event, d) => {
      menu.style("display", "none");
      chosen.style("display", null).attr("fill", d.color);
      reset.style("display", null);
    });

    reset.on("click", () => {
      chosen.style("display", "none");
      reset.style("display", "none");
      menu.style("display", null);
    });

    document.querySelector("#chart").append(svg.node());
  </script>
</body>
</html>
