<svg xmlns="http://www.w3.org/2000/svg" width="900" height="427" viewBox="0 0 900 427" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Autómata (4 estados)</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#555"/></marker>
  <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#b5b5b5"/></marker>
  <marker id="arrow-side" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9bb7d4"/></marker>
  <marker id="arrow-hl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#d33"/></marker>
  <marker id="arrow-hover" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#1b8a82"/></marker>
</defs>
<rect width="900" height="427" fill="white"/>
<g class="back-edges">
<path d="M 477.5,100 C 477.5,159.28 183.5,160.28 183.5,101" fill="none" stroke="#8fcac5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-hover)"><title>root &gt; Hover_menu  —[Unhover_menu]→  root</title></path>
<path d="M 789,72 C 789,168.66 183.5,197.66 183.5,101" fill="none" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-back)"><title>root &gt; Hover_menu &gt; optionA  —[reset]→  root</title></path>
<path d="M 789,128 C 789,224.66 183.5,197.66 183.5,101" fill="none" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-back)"><title>root &gt; Hover_menu &gt; optionB  —[reset]→  root</title></path>
</g>
<g class="forward-edges">
<path d="M 523.5,84 C 637.5,84 637.5,56 751.5,56" fill="none" stroke="#777" stroke-width="1.8" marker-end="url(#arrow)"><title>root &gt; Hover_menu  —[optionA]→  root &gt; Hover_menu &gt; optionA</title></path>
<path d="M 523.5,84 C 637.5,84 637.5,112 751.5,112" fill="none" stroke="#777" stroke-width="1.8" marker-end="url(#arrow)"><title>root &gt; Hover_menu  —[optionB]→  root &gt; Hover_menu &gt; optionB</title></path>
<path d="M 201.5,84 C 315.5,84 315.5,84 429.5,84" fill="none" stroke="#1b8a82" stroke-width="1.8" marker-end="url(#arrow-hover)"><title>root  —[Hover_menu]→  root &gt; Hover_menu
Hover_menu: g.items: se muestra; habilita: Click_optionA, Click_optionB</title></path>
</g>
<line x1="87.5" y1="84" x2="143.5" y2="84" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/>
<g class="states">
<g>
<title>root &gt; Hover_menu
  Unhover_menu → root
  optionA → root &gt; Hover_menu &gt; optionA
  optionB → root &gt; Hover_menu &gt; optionB</title>
<rect x="431.5" y="68" width="92" height="32" rx="16" fill="#f7f7f7" stroke="#333" stroke-width="1.4"/>
<text x="477.5" y="84" text-anchor="middle" dominant-baseline="central">Hover_menu</text>
</g>
<g>
<title>root &gt; Hover_menu &gt; optionA
  reset → root</title>
<rect x="753.5" y="40" width="71" height="32" rx="16" fill="#f7f7f7" stroke="#333" stroke-width="1.4"/>
<text x="789" y="56" text-anchor="middle" dominant-baseline="central">optionA</text>
</g>
<g>
<title>root
  Hover_menu → root &gt; Hover_menu</title>
<rect x="145.5" y="68" width="56" height="32" rx="16" fill="#e6f1fb" stroke="#333" stroke-width="2.4"/>
<text x="173.5" y="84" text-anchor="middle" dominant-baseline="central">root</text>
</g>
<g>
<title>root &gt; Hover_menu &gt; optionB
  reset → root</title>
<rect x="753.5" y="96" width="71" height="32" rx="16" fill="#f7f7f7" stroke="#333" stroke-width="1.4"/>
<text x="789" y="112" text-anchor="middle" dominant-baseline="central">optionB</text>
</g>
</g>
<g class="labels">
<text x="735.5" y="47" text-anchor="end" font-size="11" fill="#333">optionA</text>
<text x="735.5" y="103" text-anchor="end" font-size="11" fill="#333">optionB</text>
<text x="413.5" y="75" text-anchor="end" font-size="11" fill="#333">Hover_menu</text>
<text x="469.5" y="114" font-size="10"><tspan fill="#999">↩ Unhover_menu</tspan></text>
<text x="781" y="86" font-size="10"><tspan fill="#999">↩ reset</tspan></text>
<text x="781" y="142" font-size="10"><tspan fill="#999">↩ reset</tspan></text>
</g>
<g font-size="10" fill="#666">
<line x1="40" y1="200" x2="80" y2="200" stroke="#777" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="88" y="203">acción que avanza (etiqueta junto al destino)</text>
<line x1="360" y1="200" x2="400" y2="200" stroke="#c4c4c4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-back)"/>
<text x="408" y="203">acción que vuelve (↩ bajo el origen)</text>
<line x1="630" y1="200" x2="670" y2="200" stroke="#9bb7d4" stroke-width="1.6" marker-end="url(#arrow-side)"/>
<text x="678" y="203">a la misma columna (↕ bajo el origen)</text>
<text x="40" y="220">columnas = nivel en el nombre del estado (root = 0) · ↷ bajo el origen: acción que saltea columnas, dibujada rodeándolas · acciones sin el prefijo "Click_" · pasá el mouse por un estado o arista para ver el detalle completo</text>
<line x1="40" y1="236" x2="80" y2="236" stroke="#1b8a82" stroke-width="1.6" marker-end="url(#arrow-hover)"/>
<text x="88" y="239">acción del puntero (Hover_ / Unhover_), con su prefijo: un bucle solo resalta o muestra algo; una flecha a otro estado abre algo</text>
</g>
<line x1="40" y1="262" x2="860" y2="262" stroke="#ddd"/>
<text x="40" y="282" font-weight="bold" fill="#1a7f37">Comparación con: ( Hover_menu ( Unhover_menu | (optionA | optionB) reset ) )*</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#1a7f37">
<tspan x="40" y="300">EQUIVALENTES (autómata cortado · interacciones completas)</tspan>
</text>
<text x="40" y="333" font-weight="bold" fill="#222">Regex con los ciclos cortados (interacciones completas; 0 atajos aparte, ver regex.cycles en transitions.json)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="351">(Hover_menu (Unhover_menu | (Click_optionA | Click_optionB) Click_reset))*</tspan>
</text>
<text x="40" y="384" font-weight="bold" fill="#222">Hover (1 acción con efecto visible)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="402">Hover_menu (1; cambia de estado): g.items: se muestra; habilita: Click_optionA, Click_optionB</tspan>
</text>
</svg>