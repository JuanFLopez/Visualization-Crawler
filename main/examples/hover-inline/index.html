<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Handlers en la propiedad y en el atributo</title>
</head>
<body>
  <div id="chart"></div>
  <script src="d3.min.js"></script>
  <script>
    /*
      Handlers that do NOT go through addEventListener, built with D3: selection.property("onmouseover", fn)
      leaves the handler in the element's property, and selection.attr("onmouseover", "...") in an
      inline attribute. "prop" and "attr" are real hovers; "quiet" has a handler that changes
      nothing visible: it is not an action. "clickable" is clicked through the onclick property and
      changes state. See esperado.txt.
    */
    const base = "steelblue";
    let remembered = null;

    const svg = d3.create("svg")
        .attr("width", 420)
        .attr("height", 140)
        .style("font", "12px sans-serif");

    const dot = svg.selectAll("circle")
      .data([{ name: "prop", x: 50 }, { name: "attr", x: 130 }, { name: "quiet", x: 210 }, { name: "clickable", x: 310 }])
      .join("circle")
        .attr("cx", (d) => d.x)
        .attr("cy", 70)
        .attr("r", 28)
        .attr("fill", base);
    dot.append("title").text((d) => d.name);

    // the handler in the element's PROPERTY (el.onmouseover = fn). Careful: in D3, selection.property(name,
    // function) EVALUATES the function for each element and stores what it returns, so to leave a handler
    // it has to be returned: () => handler
    const highlight = function () { d3.select(this).attr("fill", "orange"); };
    const restore = function () { d3.select(this).attr("fill", base); };
    dot.filter((d) => d.name === "prop")
        .property("onmouseover", () => highlight)
        .property("onmouseout", () => restore);

    // the handler in an inline ATTRIBUTE (onmouseover="...")
    dot.filter((d) => d.name === "attr")
        .attr("onmouseover", "this.setAttribute('fill', 'orange')")
        .attr("onmouseout", "this.setAttribute('fill', 'steelblue')");

    // FALSE: a handler in the property that changes nothing visible
    dot.filter((d) => d.name === "quiet")
        .property("onmouseover", () => function () { remembered = "quiet"; });

    // a click through the onclick property: it changes state
    dot.filter((d) => d.name === "clickable")
        .attr("fill", "dimgray")
        .property("onclick", () => function () {
          const on = d3.select(this).attr("fill") === "seagreen";
          d3.select(this).attr("fill", on ? "dimgray" : "seagreen");
        });

    document.querySelector("#chart").append(svg.node());
  </script>
</body>
</html>
