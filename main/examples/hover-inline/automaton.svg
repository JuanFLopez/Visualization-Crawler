<svg xmlns="http://www.w3.org/2000/svg" width="900" height="386" viewBox="0 0 900 386" font-family="Helvetica, Arial, sans-serif" font-size="12">
<title>Automaton (2 states)</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#555"/></marker>
  <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#b5b5b5"/></marker>
  <marker id="arrow-side" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9bb7d4"/></marker>
  <marker id="arrow-hl" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#d33"/></marker>
  <marker id="arrow-hover" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#1b8a82"/></marker>
</defs>
<rect width="900" height="386" fill="white"/>
<g class="back-edges">
<path d="M 237.5,40 C 227.5,4 273.5,4 253.5,43" fill="none" stroke="#1b8a82" stroke-width="1.5" marker-end="url(#arrow-hover)"><title>root  —[Hover_prop, Hover_attr]→  root
Hover_prop: fill: steelblue -&gt; orange
Hover_attr: fill: steelblue -&gt; orange</title></path>
<path d="M 528,72 C 528,130.86 237.5,131.86 237.5,73" fill="none" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-back)"><title>root &gt; clickable  —[clickable]→  root</title></path>
<path d="M 552.5,40 C 542.5,4 588.5,4 568.5,43" fill="none" stroke="#1b8a82" stroke-width="1.5" marker-end="url(#arrow-hover)"><title>root &gt; clickable  —[Hover_prop, Hover_attr]→  root &gt; clickable
Hover_prop: fill: steelblue -&gt; orange
Hover_attr: fill: steelblue -&gt; orange</title></path>
</g>
<g class="forward-edges">
<path d="M 255.5,56 C 369.5,56 369.5,56 483.5,56" fill="none" stroke="#777" stroke-width="1.8" marker-end="url(#arrow)"><title>root  —[clickable]→  root &gt; clickable</title></path>
</g>
<line x1="141.5" y1="56" x2="197.5" y2="56" stroke="#555" stroke-width="2.2" marker-end="url(#arrow)"/>
<g class="states">
<g>
<title>root
  clickable → root &gt; clickable
  Hover_prop → root
  Hover_attr → root</title>
<rect x="199.5" y="40" width="56" height="32" rx="16" fill="#e6f1fb" stroke="#333" stroke-width="2.4"/>
<text x="227.5" y="56" text-anchor="middle" dominant-baseline="central">root</text>
</g>
<g>
<title>root &gt; clickable
  clickable → root
  Hover_prop → root &gt; clickable
  Hover_attr → root &gt; clickable</title>
<rect x="485.5" y="40" width="85" height="32" rx="16" fill="#f7f7f7" stroke="#333" stroke-width="1.4"/>
<text x="528" y="56" text-anchor="middle" dominant-baseline="central">clickable</text>
</g>
</g>
<g class="labels">
<text x="265.5" y="20" font-size="11" fill="#1b7f79">Hover_prop, Hover_attr</text>
<text x="580.5" y="20" font-size="11" fill="#1b7f79">Hover_prop, Hover_attr</text>
<text x="467.5" y="47" text-anchor="end" font-size="11" fill="#333">clickable</text>
<text x="520" y="86" font-size="10"><tspan fill="#999">↩ clickable</tspan></text>
</g>
<g font-size="10" fill="#666">
<line x1="40" y1="144" x2="80" y2="144" stroke="#777" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="88" y="147">forward action (label next to the target)</text>
<line x1="360" y1="144" x2="400" y2="144" stroke="#c4c4c4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-back)"/>
<text x="408" y="147">backward action (↩ under the source)</text>
<line x1="630" y1="144" x2="670" y2="144" stroke="#9bb7d4" stroke-width="1.6" marker-end="url(#arrow-side)"/>
<text x="678" y="147">to the same column (↕ under the source)</text>
<text x="40" y="164">columns = level in the state name (root = 0) · ↷ under the source: action that skips columns, drawn around them · actions without the "Click_" prefix · hover a state or an edge for the full detail</text>
<line x1="40" y1="180" x2="80" y2="180" stroke="#1b8a82" stroke-width="1.6" marker-end="url(#arrow-hover)"/>
<text x="88" y="183">pointer action (Hover_ / Unhover_), shown with its prefix: a loop only highlights or shows something; an arrow to another state opens something</text>
</g>
<line x1="40" y1="206" x2="860" y2="206" stroke="#ddd"/>
<text x="40" y="226" font-weight="bold" fill="#1a7f37">Comparison with: ( (Hover_prop | Hover_attr)* clickable (Hover_prop | Hover_attr)* clickable )* (Hover_prop | Hover_attr)*</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#1a7f37">
<tspan x="40" y="244">EQUIVALENT (cut automaton · complete interactions)</tspan>
</text>
<text x="40" y="277" font-weight="bold" fill="#222">Regex with the cycles cut (complete interactions; 0 shortcuts listed apart, see regex.cycles in transitions.json)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="295">(Hover_prop | Hover_attr | Click_clickable (Hover_prop | Hover_attr)* Click_clickable)*</tspan>
</text>
<text x="40" y="328" font-weight="bold" fill="#222">Hover (2 actions with a visible effect)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="346">Hover_prop, Hover_attr (2; loop on the state): fill: steelblue -&gt; orange</tspan>
<tspan x="40" y="361">NOT actions (no visible effect): Hover_quiet (2 states)</tspan>
</text>
</svg>