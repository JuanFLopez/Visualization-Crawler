<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="Helvetica, Arial, sans-serif" font-size="11">
<title>Autómata (2 estados)</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#555"/></marker>
  <marker id="arrow-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#b5b5b5"/></marker>
  <marker id="arrow-side" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#9bb7d4"/></marker>
  <marker id="arrow-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#d33"/></marker>
  <marker id="arrow-hover" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#1b8a82"/></marker>
</defs>
<rect width="900" height="370" fill="white"/>
<g class="back-edges">
<path d="M 289.2,40 C 283.2,16 315.2,16 301.2,42" fill="none" stroke="#1b8a82" stroke-width="1" marker-end="url(#arrow-hover)"><title>root  —[Hover_prop, Hover_attr]→  root
Hover_prop: fill: steelblue -&gt; orange
Hover_attr: fill: steelblue -&gt; orange</title></path>
<path d="M 493,66 C 493,108.936 285.2,109.936 285.2,67" fill="none" stroke="#c4c4c4" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-back)"><title>root &gt; clickable  —[clickable]→  root</title></path>
<path d="M 518.8,40 C 512.8,16 544.8,16 530.8,42" fill="none" stroke="#1b8a82" stroke-width="1" marker-end="url(#arrow-hover)"><title>root &gt; clickable  —[Hover_prop, Hover_attr]→  root &gt; clickable
Hover_prop: fill: steelblue -&gt; orange
Hover_attr: fill: steelblue -&gt; orange</title></path>
</g>
<g class="forward-edges">
<path d="M 303.2,53 C 377.2,53 377.2,53 451.2,53" fill="none" stroke="#777" stroke-width="1.1" marker-end="url(#arrow)"><title>root  —[clickable]→  root &gt; clickable</title></path>
</g>
<line x1="207.2" y1="53" x2="245.2" y2="53" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="states">
<g>
<title>root
  clickable → root &gt; clickable
  Hover_prop → root
  Hover_attr → root</title>
<rect x="247.2" y="40" width="56" height="26" rx="13" fill="#e6f1fb" stroke="#333" stroke-width="2"/>
<text x="275.2" y="53" text-anchor="middle" dominant-baseline="central">root</text>
</g>
<g>
<title>root &gt; clickable
  clickable → root
  Hover_prop → root &gt; clickable
  Hover_attr → root &gt; clickable</title>
<rect x="453.2" y="40" width="79.6" height="26" rx="13" fill="#f7f7f7" stroke="#333" stroke-width="1"/>
<text x="493" y="53" text-anchor="middle" dominant-baseline="central">clickable</text>
</g>
</g>
<g class="labels">
<text x="311.2" y="26" font-size="10" fill="#1b7f79">Hover_prop, Hover_attr</text>
<text x="540.8" y="26" font-size="10" fill="#1b7f79">Hover_prop, Hover_attr</text>
<text x="445.2" y="48" text-anchor="end" font-size="10" fill="#333">clickable</text>
<text x="485" y="76" font-size="9"><tspan fill="#999">↩ clickable</tspan></text>
</g>
<g font-size="10" fill="#666">
<line x1="40" y1="128" x2="68" y2="128" stroke="#777" marker-end="url(#arrow)"/>
<text x="74" y="131">acción que avanza (etiqueta junto al destino)</text>
<line x1="330" y1="128" x2="358" y2="128" stroke="#c4c4c4" stroke-dasharray="4 3" marker-end="url(#arrow-back)"/>
<text x="364" y="131">acción que vuelve (↩ bajo el origen)</text>
<line x1="570" y1="128" x2="598" y2="128" stroke="#9bb7d4" marker-end="url(#arrow-side)"/>
<text x="604" y="131">a la misma columna (↕ bajo el origen)</text>
<text x="40" y="148">columnas = nivel en el nombre del estado (root = 0) · ↷ bajo el origen: acción que saltea columnas, dibujada rodeándolas · acciones sin el prefijo "Click_" · pasá el mouse por un estado o arista para ver el detalle completo</text>
<line x1="40" y1="164" x2="68" y2="164" stroke="#1b8a82" marker-end="url(#arrow-hover)"/>
<text x="74" y="167">acción del puntero (Hover_ / Unhover_), con su prefijo: un bucle solo resalta o muestra algo; una flecha a otro estado abre algo</text>
</g>
<line x1="40" y1="190" x2="860" y2="190" stroke="#ddd"/>
<text x="40" y="210" font-weight="bold" fill="#1a7f37">Comparación con: ( (Hover_prop | Hover_attr)* clickable (Hover_prop | Hover_attr)* clickable )* (Hover_prop | Hover_attr)*</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#1a7f37">
<tspan x="40" y="228">EQUIVALENTES (autómata cortado · interacciones completas)</tspan>
</text>
<text x="40" y="261" font-weight="bold" fill="#222">Regex con los ciclos cortados (interacciones completas; 0 atajos aparte, ver regex.cycles en transitions.json)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="279">(Hover_prop | Hover_attr | Click_clickable (Hover_prop | Hover_attr)* Click_clickable)*</tspan>
</text>
<text x="40" y="312" font-weight="bold" fill="#222">Hover (2 acciones con efecto visible)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="330">Hover_prop, Hover_attr (2; bucle en el estado): fill: steelblue -&gt; orange</tspan>
<tspan x="40" y="345">NO son acciones (sin efecto visible): Hover_quiet (2 estados)</tspan>
</text>
</svg>