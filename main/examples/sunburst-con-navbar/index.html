<!doctype html>
<html>
<head><meta charset="utf-8"></head>

  <a href="/about" id="navabout">About</a>

document.getElementById('navabout').addEventListener('click', (e) => { e.preventDefault(); console.log('nav click 2'); });

<div id="app"></div>
<script src="d3.min.js"></script>
<script>
// --- codigo tal cual, SIN data-name ni window.__testState ---
const data = {
  name: "root",
  children: [
    { name: "A", children: [ { name: "A1", value: 10 }, { name: "A2", value: 10 } ] },
    { name: "B", children: [ { name: "B1", value: 10 }, { name: "B2", value: 10 } ] }
  ]
};
const width = 420;
const radius = width / 6;
const colorByBranch = { A: "#378ADD", B: "#D85A30" };
const hierarchy = d3.hierarchy(data).sum(d => d.value).sort((a,b) => b.value - a.value);
const root = d3.partition().size([2 * Math.PI, hierarchy.height + 1])(hierarchy);
root.each(d => d.current = d);
const arc = d3.arc().startAngle(d => d.x0).endAngle(d => d.x1).padAngle(0.01).padRadius(radius * 1.5)
  .innerRadius(d => d.y0 * radius).outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));
const svg = d3.select("#app").append("svg").attr("viewBox", [-width/2, -width/2, width, width]);
const path = svg.append("g").selectAll("path").data(root.descendants().slice(1)).join("path")
  .attr("fill", d => { let a = d; while (a.depth > 1) a = a.parent; return colorByBranch[a.data.name]; })
  .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.85 : 0.55) : 0)
  .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
  .attr("d", d => arc(d.current));
path.filter(d => d.children).style("cursor", "pointer").on("click", clicked);
const parent = svg.append("circle").datum(root).attr("r", radius).attr("fill", "none")
  .attr("pointer-events", "all").on("click", clicked);
function clicked(event, p) {
  parent.datum(p.parent || root);
  root.each(d => d.target = {
    x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
    x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
    y0: Math.max(0, d.y0 - p.depth), y1: Math.max(0, d.y1 - p.depth)
  });
  const t = svg.transition().duration(400);
  path.transition(t).tween("data", d => { const i = d3.interpolate(d.current, d.target); return t => d.current = i(t); })
    .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.85 : 0.55) : 0)
    .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
    .attrTween("d", d => () => arc(d.current));
}
function arcVisible(d) { return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0; }
</script>
</body>
</html>
