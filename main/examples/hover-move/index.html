<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Hovers que dependen de dónde está el puntero</title>
</head>
<body>
  <div id="chart"></div>
  <script src="d3.min.js"></script>
  <script>
    /*
      Hovers cuyo efecto depende de DÓNDE está el puntero, hechos con D3: un tooltip que sigue al
      cursor (el patrón de mouseover + mousemove + mouseout) y una línea guía con su lectura que
      solo escucha pointermove. Los dos tienen que aparecer, avisando que dependen de la posición.
      "recorder" escucha mousemove pero no cambia nada que se vea: no es una acción. Ver esperado.txt.
    */
    const base = "steelblue";
    let lastPointer = null;

    const svg = d3.create("svg")
        .attr("width", 620)
        .attr("height", 220)
        .style("font", "12px sans-serif");

    // el tooltip HTML, fuera del <svg>
    const tip = d3.select("body").append("div")
        .attr("id", "tip")
        .style("position", "absolute")
        .style("padding", "4px 8px")
        .style("background", "#333")
        .style("color", "#fff")
        .style("opacity", 0)
        .style("pointer-events", "none");

    // 1. un tooltip que sigue al puntero: mouseover lo muestra, mousemove lo lleva, mouseout lo saca
    const dot = svg.selectAll("circle.dot")
      .data([{ name: "dotA", x: 60 }, { name: "dotB", x: 160 }])
      .join("circle")
        .attr("class", "dot")
        .attr("cx", (d) => d.x)
        .attr("cy", 70)
        .attr("r", 30)
        .attr("fill", base);
    dot.append("title").text((d) => d.name);
    dot
        .on("mouseover", (event, d) => tip.style("opacity", 1).text(d.name))
        .on("mousemove", (event) => tip.style("left", `${event.pageX + 12}px`).style("top", `${event.pageY + 12}px`))
        .on("mouseout", () => tip.style("opacity", 0));

    // 2. una línea guía con su lectura, solo con pointermove / pointerleave
    const chart = svg.append("g").attr("class", "chart").attr("transform", "translate(300,20)");
    const overlay = chart.append("rect")
        .attr("class", "overlay")
        .attr("width", 280)
        .attr("height", 160)
        .attr("fill", "#f2f2f2");
    overlay.append("title").text("overlay");
    const guide = chart.append("line")
        .attr("class", "guide")
        .attr("y1", 0)
        .attr("y2", 160)
        .attr("stroke", "#888")
        .style("pointer-events", "none")
        .style("display", "none");
    const readout = chart.append("text")
        .attr("class", "readout")
        .attr("y", 14)
        .style("pointer-events", "none")
        .style("display", "none");
    overlay
        .on("pointermove", (event) => {
          const [x] = d3.pointer(event);
          guide.style("display", null).attr("x1", x).attr("x2", x);
          readout.style("display", null).attr("x", x + 6).text(Math.round(x));
        })
        .on("pointerleave", () => {
          guide.style("display", "none");
          readout.style("display", "none");
        });

    // FALSO: escucha mousemove pero solo se acuerda de dónde estuvo el puntero, no cambia nada que se vea
    svg.append("circle")
        .attr("class", "recorder")
        .attr("cx", 60)
        .attr("cy", 160)
        .attr("r", 20)
        .attr("fill", "lightgray")
        .on("mousemove", (event) => { lastPointer = [event.clientX, event.clientY]; })
      .append("title").text("recorder");

    document.querySelector("#chart").append(svg.node());
  </script>
</body>
</html>
