<text x="88" y="315">acción que avanza (etiqueta junto al destino)</text>
<line x1="360" y1="312" x2="400" y2="312" stroke="#c4c4c4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-back)"/>
<text x="408" y="315">acción que vuelve (↩ bajo el origen)</text>
<line x1="630" y1="312" x2="670" y2="312" stroke="#9bb7d4" stroke-width="1.6" marker-end="url(#arrow-side)"/>
<text x="678" y="315">a la misma columna (↕ bajo el origen)</text>
<text x="40" y="332">columnas = nivel en el nombre del estado (root = 0) · ↷ bajo el origen: acción que saltea columnas, dibujada rodeándolas · acciones sin el prefijo "Click_" · pasá el mouse por un estado o arista para ver el detalle completo</text>
</g>
<line x1="40" y1="356" x2="1024" y2="356" stroke="#ddd"/>
<text x="40" y="376" font-weight="bold" fill="#c33">Comportamiento inesperado (comparado con: ( circle
| (A | A1 circle) (A1 circle)* circle
| (B | B2 circle) (B2 circle)* circle
| C circle
| (D | D2 circle | D1 (D1a circle)* circle) (D2 circle | (D1 | D1a circle) (D1a circle)* circle)* circle
)*, contra el autómata completo)   (en rojo: la primera serie de eventos)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#c33">
<tspan x="40" y="394">Hay un comportamiento inesperado cuando ocurre esta serie de eventos: B2 → circle → circle</tspan>
<tspan x="40" y="409">    el regex esperado admite click &quot;B2&quot; en el paso 1, pero en &quot;root&quot; la visualización no lo ofrece</tspan>
<tspan x="40" y="424">Hay un comportamiento inesperado cuando ocurre esta serie de eventos: B → B2 → circle → circle</tspan>
<tspan x="40" y="439">    el regex esperado admite click &quot;B2&quot; en el paso 2, pero en &quot;root &gt; B&quot; la visualización no lo ofrece</tspan>
</text>
<text x="40" y="472" font-weight="bold" fill="#222">Regex con los ciclos cortados (interacciones completas; 4 atajos aparte, ver regex.cycles en transitions.json)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="490">((Click_D ((Click_D1 (Click_D1a Click_circle)* | Click_D2) Click_circle)* | Click_B | Click_A (Click_A1 Click_circle)* | Click_C)? Click_circle)*</tspan>
</text>
