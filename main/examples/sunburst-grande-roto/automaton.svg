<g font-size="10" fill="#666">
<line x1="40" y1="248" x2="68" y2="248" stroke="#777" marker-end="url(#arrow)"/>
<text x="74" y="251">acción que avanza (etiqueta junto al destino)</text>
<line x1="330" y1="248" x2="358" y2="248" stroke="#c4c4c4" stroke-dasharray="4 3" marker-end="url(#arrow-back)"/>
<text x="364" y="251">acción que vuelve (↩ bajo el origen)</text>
<line x1="570" y1="248" x2="598" y2="248" stroke="#9bb7d4" marker-end="url(#arrow-side)"/>
<text x="604" y="251">a la misma columna (↕ bajo el origen)</text>
<text x="40" y="268">columnas = nivel en el nombre del estado (root = 0) · ↷ bajo el origen: acción que saltea columnas, dibujada rodeándolas · acciones sin el prefijo "Click_" · pasá el mouse por un estado o arista para ver el detalle completo</text>
</g>
<line x1="40" y1="292" x2="860" y2="292" stroke="#ddd"/>
<text x="40" y="312" font-weight="bold" fill="#c33">Comportamiento inesperado (comparado con: ( circle
| (A | A1 circle) (A1 circle)* circle
| (B | B2 circle) (B2 circle)* circle
| C circle
| (D | D2 circle | D1 (D1a circle)* circle) (D2 circle | (D1 | D1a circle) (D1a circle)* circle)* circle
)*, contra el autómata completo)   (en rojo: la primera serie de eventos)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#c33">
<tspan x="40" y="330">Hay un comportamiento inesperado cuando ocurre esta serie de eventos: B2 → circle → circle</tspan>
<tspan x="40" y="345">    el regex esperado admite click &quot;B2&quot; en el paso 1, pero en &quot;root&quot; la visualización no lo ofrece</tspan>
<tspan x="40" y="360">Hay un comportamiento inesperado cuando ocurre esta serie de eventos: B → B2 → circle → circle</tspan>
<tspan x="40" y="375">    el regex esperado admite click &quot;B2&quot; en el paso 2, pero en &quot;root &gt; B&quot; la visualización no lo ofrece</tspan>
</text>
<text x="40" y="408" font-weight="bold" fill="#222">Regex con los ciclos cortados (interacciones completas; 4 atajos aparte, ver regex.cycles en transitions.json)</text>
<text font-family="Consolas, Menlo, monospace" font-size="11" fill="#333">
<tspan x="40" y="426">((Click_D ((Click_D1 (Click_D1a Click_circle)* | Click_D2) Click_circle)* | Click_B | Click_A (Click_A1 Click_circle)* |</tspan>
<tspan x="40" y="441">Click_C)? Click_circle)*</tspan>
</text>
