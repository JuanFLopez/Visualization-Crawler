<div id="sb" style="display:flex;justify-content:center"></div>
<script src="d3.min.js"></script>
<script>
// Sunburst zoomable con 4 niveles de profundidad. Se ven siempre dos anillos
// por debajo del foco, así que desde un foco se puede clickear tanto un hijo
// como un nieto (un "atajo" de dos niveles).
const data = {
  name: "root",
  children: [
    { name: "A", children: [
      { name: "A1", children: [ { name: "A1a", value: 10 }, { name: "A1b", value: 10 } ] },
      { name: "A2", value: 10 }
    ] },
    { name: "B", children: [
      { name: "B1", value: 10 },
      { name: "B2", children: [ { name: "B2a", value: 10 }, { name: "B2b", value: 10 }, { name: "B2c", value: 10 } ] }
    ] },
    { name: "C", children: [ { name: "C1", value: 10 }, { name: "C2", value: 10 }, { name: "C3", value: 10 } ] },
    { name: "D", children: [
      { name: "D1", children: [
        { name: "D1a", children: [ { name: "D1a1", value: 10 }, { name: "D1a2", value: 10 } ] },
        { name: "D1b", value: 10 }
      ] },
      { name: "D2", children: [ { name: "D2a", value: 10 }, { name: "D2b", value: 10 } ] }
    ] }
  ]
};

const width = 600;
const radius = width / 6;
const colorByBranch = { A: "#378ADD", B: "#D85A30", C: "#2E9E6B", D: "#8A5CC4" };

const hierarchy = d3.hierarchy(data).sum(d => d.value).sort((a,b) => b.value - a.value);
const root = d3.partition().size([2 * Math.PI, hierarchy.height + 1])(hierarchy);
root.each(d => d.current = d);

const arc = d3.arc()
  .startAngle(d => d.x0)
  .endAngle(d => d.x1)
  .padAngle(0.01)
  .padRadius(radius * 1.5)
  .innerRadius(d => d.y0 * radius)
  .outerRadius(d => Math.max(d.y0 * radius, d.y1 * radius - 1));

const svg = d3.select("#sb").append("svg")
  .attr("viewBox", [-width/2, -width/2, width, width])
  .style("font", "13px sans-serif")
  .style("max-width", "100%")
  .style("height", "auto");

const path = svg.append("g")
  .selectAll("path")
  .data(root.descendants().slice(1))
  .join("path")
    .attr("fill", d => { let a = d; while (a.depth > 1) a = a.parent; return colorByBranch[a.data.name]; })
    .attr("fill-opacity", d => arcVisible(d.current) ? (d.children ? 0.85 : 0.55) : 0)
    .attr("pointer-events", d => arcVisible(d.current) ? "auto" : "none")
    .attr("stroke", "var(--surface-2)")
    .attr("stroke-width", 1)
    .attr("d", d => arc(d.current));

path.filter(d => d.children && d.data.name !== "B2")
  .style("cursor", "pointer")
  .on("click", clicked);

path.append("title").text(d => d.ancestors().map(a => a.data.name).reverse().join(" / "));

const label = svg.append("g")
  .attr("pointer-events", "none")
  .attr("text-anchor", "middle")
  .selectAll("text")
  .data(root.descendants().slice(1))
  .join("text")
    .attr("fill-opacity", d => +arcVisible(d.current))
    .attr("fill", "#fff")
    .attr("transform", d => labelTransform(d.current))
    .attr("dy", "0.35em")
    .text(d => d.data.name);

const parent = svg.append("circle")
  .datum(root)
  .attr("r", radius)
  .attr("fill", "none")
  .attr("pointer-events", "all")
  .style("cursor", "pointer")
  .on("click", clicked);

function clicked(event, p) {
  parent.datum(p.parent || root);

  root.each(d => d.target = {
    x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
    x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
    y0: Math.max(0, d.y0 - p.depth),
    y1: Math.max(0, d.y1 - p.depth)
  });

  const t = svg.transition().duration(650);

  path.transition(t)
      .tween("data", d => {
        const i = d3.interpolate(d.current, d.target);
        return t => d.current = i(t);
      })
    .filter(function(d) { return +this.getAttribute("fill-opacity") || arcVisible(d.target); })
      .attr("fill-opacity", d => arcVisible(d.target) ? (d.children ? 0.85 : 0.55) : 0)
      .attr("pointer-events", d => arcVisible(d.target) ? "auto" : "none")
      .attrTween("d", d => () => arc(d.current));

  label.filter(function(d) { return +this.getAttribute("fill-opacity") || arcVisible(d.target); })
    .transition(t)
      .attr("fill-opacity", d => +arcVisible(d.target))
      .attrTween("transform", d => () => labelTransform(d.current));
}

function arcVisible(d) { return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0; }

function labelTransform(d) {
  const x = (d.x0 + d.x1) / 2 * 180 / Math.PI;
  const y = (d.y0 + d.y1) / 2 * radius;
  return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
}
</script>
