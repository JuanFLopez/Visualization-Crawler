<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Hovers reales y falsos</title>
</head>
<body>
  <div id="chart"></div>
  <script src="d3.min.js"></script>
  <script>
    /*
      Real hovers and hovers that are NOT, all built with D3: one circle per case, described by a
      datum. The real ones (real, tip, delayed, and late in the second state) have to show up in the
      automaton; none of the others. See esperado.txt.
    */
    const base = "steelblue";
    let remembered = null;
    let second = false;

    const svg = d3.create("svg")
        .attr("width", 620)
        .attr("height", 210)
        .style("font", "12px sans-serif");

    // the HTML tooltip, outside the <svg> (the usual D3 pattern)
    const tip = d3.select("body").append("div")
        .attr("id", "tip")
        .style("position", "absolute")
        .style("left", "10px")
        .style("top", "230px")
        .style("padding", "4px 8px")
        .style("background", "#333")
        .style("color", "#fff")
        .style("opacity", 0)
        .style("pointer-events", "none");

    // an element that exists only so a handler has something to touch, and it is hidden
    const ghost = svg.append("text")
        .attr("x", 340)
        .attr("y", 140)
        .style("display", "none")
        .text("ghost");

    const cases = [
      // REAL: highlight
      { name: "real", x: 40, y: 60,
        over() { d3.select(this).attr("fill", "orange"); },
        out() { d3.select(this).attr("fill", base); } },

      // REAL: tooltip
      { name: "tip", x: 100, y: 60,
        over() { tip.style("opacity", 1).text("info"); },
        out() { tip.style("opacity", 0); } },

      // REAL: the effect arrives 300 ms later
      { name: "delayed", x: 160, y: 60,
        over() { const el = this; setTimeout(() => d3.select(el).attr("fill", "orange"), 300); },
        out() { d3.select(this).attr("fill", base); } },

      // FALSE: the handler only stores something in a variable, nothing visible changes
      { name: "inert", x: 220, y: 60,
        over() { remembered = "inert"; } },

      // FALSE: it changes and reverts in the same step; the net effect is nil
      { name: "flash", x: 280, y: 60,
        over() { d3.select(this).attr("stroke", "red"); d3.select(this).attr("stroke", null); } },

      // FALSE: the only thing it touches is hidden
      { name: "hiddenEffect", x: 340, y: 60,
        over() { ghost.attr("data-poked", "1"); } },

      // FALSE: covered by another element (see the rect further down); no pointer reaches it
      { name: "covered", x: 400, y: 60,
        over() { d3.select(this).attr("fill", "orange"); } },

      // FALSE: pointer-events: none, it cannot be pointed at
      { name: "noPointer", x: 460, y: 60, pointerEvents: "none",
        over() { d3.select(this).attr("fill", "orange"); } },

      // FALSE: not visible
      { name: "hidden", x: 520, y: 60, hidden: true,
        over() { d3.select(this).attr("fill", "orange"); } },

      // REAL, but only in the second state: it appears when "toggle" is clicked
      { name: "late", x: 40, y: 150, hidden: true,
        over() { d3.select(this).attr("fill", "orange"); },
        out() { d3.select(this).attr("fill", base); } },

      // FALSE: it can only be clicked; a user pointing at it before clicking does not make it
      // a hover. The click changes state: "late" appears and "real" disappears.
      { name: "toggle", x: 100, y: 150, fill: "gray",
        click() {
          second = !second;
          dot.filter((d) => d.name === "late").style("display", second ? null : "none");
          dot.filter((d) => d.name === "real").style("display", second ? "none" : null);
        } },
    ];

    const dot = svg.selectAll("circle")
      .data(cases)
      .join("circle")
        .attr("cx", (d) => d.x)
        .attr("cy", (d) => d.y)
        .attr("r", 20)
        .attr("fill", (d) => d.fill || base)
        .style("pointer-events", (d) => d.pointerEvents || null)
        .style("display", (d) => (d.hidden ? "none" : null));
    dot.append("title").text((d) => d.name);

    // a listener only on the ones that have it: "toggle" has no hover one
    dot.filter((d) => d.over).on("mouseover", function (event, d) { d.over.call(this, event, d); });
    dot.filter((d) => d.out).on("mouseout", function (event, d) { d.out.call(this, event, d); });
    dot.filter((d) => d.click).on("click", function (event, d) { d.click.call(this, event, d); });

    // the one covering "covered": drawn later, so it ends up on top
    svg.append("rect")
        .attr("x", 370)
        .attr("y", 30)
        .attr("width", 60)
        .attr("height", 60)
        .attr("fill", "white");

    document.querySelector("#chart").append(svg.node());
  </script>
</body>
</html>
